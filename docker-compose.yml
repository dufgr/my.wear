name: my-wear

services:
  postgres:
    image: postgres:16-alpine
    container_name: my-wear-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mywear
      POSTGRES_USER: mywear
      POSTGRES_PASSWORD: mywear_dev
    ports:
      - "5432:5432"
    volumes:
      - my-wear-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mywear -d mywear"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  my-wear-postgres-data:
